name: Test, Build, Sign and Package Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build portable executable
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name SpaceMedic --add-data "spacemedic/cleanup_rules.json;spacemedic" run_spacemedic.pyw
      - name: Import optional code-signing certificate
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}"))
          $secure = ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Sort-Object NotAfter -Descending | Select-Object -First 1
          Set-AuthenticodeSignature -FilePath dist\SpaceMedic.exe -Certificate $cert -TimestampServer http://timestamp.digicert.com -HashAlgorithm SHA256
      - name: Build Inno Setup installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Sign installer when certificate is configured
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Sort-Object NotAfter -Descending | Select-Object -First 1
          Set-AuthenticodeSignature -FilePath dist\SpaceMedic-Setup-x64.exe -Certificate $cert -TimestampServer http://timestamp.digicert.com -HashAlgorithm SHA256
      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/SpaceMedic.exe release/
          Copy-Item README.md,CHANGELOG.md,WINDOWS_TEST_CHECKLIST.md,MEMORY_RESEARCH_REVIEW.md,PRIVACY.md,SECURITY.md,CONTRIBUTING.md,SUPPORT.md,CODE_OF_CONDUCT.md,LICENSE release/
          Compress-Archive -Path release/* -DestinationPath SpaceMedic-Portable-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMedic-Windows-x64
          path: |
            SpaceMedic-Portable-Windows-x64.zip
            dist/SpaceMedic-Setup-x64.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpaceMedic-Portable-Windows-x64.zip
            dist/SpaceMedic-Setup-x64.exe
